<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Resolve all relative asset/URLs against the deployment root so deep
       links like /maths/circles load js/app.js and app.css correctly. -->
  <script>
    document.write('<base href="' +
      (location.hostname.endsWith('github.io') ? '/erin-study-schedule/' : '/') + '">');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Erin · Study Schedule</title>
  <link rel="stylesheet" href="app.css?v=1788389869">
  <!-- SPA redirect decode: restores the real path after a 404.html bounce. -->
  <script>
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    }(window.location));
  </script>
</head>
<body>
  <main id="app"><div class="loading">Loading…</div></main>
  <script type="module" src="js/app.js?v=1788389869"></script>
</body>
</html>
