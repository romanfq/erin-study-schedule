<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Erin · Study Schedule</title>
  <!--
    GitHub Pages single-page-app redirect (rafgraph/spa-github-pages).
    pathSegmentsToKeep = 1 keeps the project base "/erin-study-schedule/".
  -->
  <script>
    (function (l) {
      var pathSegmentsToKeep = 1;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    }(window.location));
  </script>
</head>
<body></body>
</html>
